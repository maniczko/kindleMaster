name: Apply issue 341 download route patch

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write
  pull-requests: read

jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Patch download route globs
        run: python scripts/patch_issue_341_download_routes.py

      - name: Remove one-time patch machinery
        run: rm scripts/patch_issue_341_download_routes.py .github/workflows/apply-issue-341-download-routes.yml

      - name: Commit route updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Mock protected download URLs in runtime tests (#341)"
          git push origin HEAD:${{ github.head_ref }}
