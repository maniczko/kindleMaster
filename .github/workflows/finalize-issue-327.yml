name: Finalize issue 327 semantic release gate

on:
  pull_request:

permissions:
  contents: write
  pull-requests: read

jobs:
  finalize:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Synchronize stacked base without publishing partial changes
        run: |
          git fetch origin agent/issue-326-semantic-navigation
          git merge --no-commit --no-ff origin/agent/issue-326-semantic-navigation

      - name: Reuse canonical internal-link validator
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("chess_semantic_release_gate.py")
          text = path.read_text(encoding="utf-8")
          import_anchor = "from typing import Any, Iterable, Mapping\n"
          import_line = "from chess_exercise_navigation import validate_internal_links\n"
          if import_line not in text:
              if text.count(import_anchor) != 1:
                  raise RuntimeError("semantic gate import anchor mismatch")
              text = text.replace(import_anchor, import_anchor + "\n" + import_line, 1)

          start = text.index("def _validate_documents(documents: Mapping[str, str]) -> list[GateFinding]:\n")
          end = text.index("\ndef _warning_codes(\n", start)
          replacement = '''def _validate_documents(documents: Mapping[str, str]) -> list[GateFinding]:
              findings: list[GateFinding] = []
              for name, body in documents.items():
                  parser = _DocumentParser()
                  parser.feed(str(body or ""))
                  for item in parser.list_item_text:
                      if re.match(r"^\\d+\\.(?:\\.\\.)?\\s*[KQRBNOa-h]", item):
                          findings.append(
                              _finding(
                                  "CHESS_NOTATION_RENDERED_AS_HTML_LIST",
                                  f"Chess notation was rendered as a list item in {name}: {item[:80]}",
                                  source=str(name),
                              )
                          )

              link_report = validate_internal_links(documents)
              for duplicate in link_report.duplicate_anchors:
                  findings.append(
                      _finding(
                          "DUPLICATE_INTERNAL_ANCHOR",
                          f"Duplicate internal anchor: {duplicate}.",
                          source=duplicate.split("#", 1)[0],
                      )
                  )
              for orphan in link_report.orphan_hrefs:
                  findings.append(
                      _finding(
                          "ORPHAN_INTERNAL_FRAGMENT",
                          f"Internal link has no matching target: {orphan}.",
                          source=orphan.split(" -> ", 1)[0],
                      )
                  )
              return findings
          '''
          text = text[:start] + replacement + text[end:]
          path.write_text(text, encoding="utf-8")
          PY

      - name: Add cross-directory fragment regression
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("tests/chess/test_semantic_release_gate.py")
          text = path.read_text(encoding="utf-8")
          anchor = "    def test_orphan_fragment_is_blocked(self) -> None:\n"
          test = (
              "    def test_cross_directory_fragments_use_canonical_validator(self) -> None:\n"
              "        report = evaluate_semantic_release_gate(\n"
              "            book(accepted_exercise()),\n"
              "            mode=\"strict\",\n"
              "            documents={\n"
              "                \"exercises/chapter.xhtml\": (\n"
              "                    '<article id=\"exercise-ex-1-1\">'\n"
              "                    '<a href=\"../solutions/chapter.xhtml#solution-ex-1-1\">solution</a>'\n"
              "                    '</article>'\n"
              "                ),\n"
              "                \"solutions/chapter.xhtml\": (\n"
              "                    '<section id=\"solution-ex-1-1\">'\n"
              "                    '<a href=\"../exercises/chapter.xhtml#exercise-ex-1-1\">back</a>'\n"
              "                    '</section>'\n"
              "                ),\n"
              "            },\n"
              "        )\n"
              "        self.assertFalse(any(item.code == \"ORPHAN_INTERNAL_FRAGMENT\" for item in report.findings))\n"
              "\n"
          )
          if "test_cross_directory_fragments_use_canonical_validator" not in text:
              if text.count(anchor) != 1:
                  raise RuntimeError("cross-directory test anchor mismatch")
              text = text.replace(anchor, test + anchor, 1)
          path.write_text(text, encoding="utf-8")
          PY

      - name: Bootstrap runtime dependencies
        run: python kindlemaster.py bootstrap --runtime-only

      - name: Validate final gate and stacked contracts
        shell: bash
        run: |
          mkdir -p reports/semantic-release-gate-finalize
          set -o pipefail
          python -m unittest -v \
            test_chess_semantic_release_gate \
            tests.chess.test_exercise_solution_navigation \
            tests.chess.test_semantic_navigation_model \
            tests.chess.test_solution_integrity \
            tests.chess.test_solution_integrity_model \
            tests.chess.test_exercise_reconciliation \
            tests.chess.test_exercise_model_reconciliation \
            test_chess_reader_exercises \
            test_chess_reader_solutions \
            test_chess_reader_navigation \
            2>&1 | tee reports/semantic-release-gate-finalize/focused.log

      - name: Upload finalization evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: issue-327-finalization
          path: reports/semantic-release-gate-finalize/
          if-no-files-found: warn
          retention-days: 7

      - name: Remove one-time workflow and commit validated merge
        run: |
          rm .github/workflows/finalize-issue-327.yml
          git add -A
          git diff --cached --check
          git commit -m "Finalize blocking semantic release gate (#327)"
          git push origin HEAD:${{ github.head_ref }}
