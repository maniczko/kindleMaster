name: Apply issue 321 model integration

on:
  pull_request:

permissions:
  contents: write
  pull-requests: read

jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Preserve existing missing-solution warning contract
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('.github/scripts/apply_issue_321_model_integration.py')
          text = path.read_text(encoding='utf-8')
          old = (
              '        "        for finding in integrity_record.findings:\\n"\n'
              '        "            warnings.append(\\n"\n'
          )
          new = (
              '        "        for finding in integrity_record.findings:\\n"\n'
              '        "            if finding.code == \\"MISSING_SOLUTION_TEXT\\" and not solution_evidence:\\n"\n'
              '        "                continue\\n"\n'
              '        "            warnings.append(\\n"\n'
          )
          if text.count(old) != 1:
              raise RuntimeError('Could not locate issue 321 compatibility anchor')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Apply model integration
        run: python .github/scripts/apply_issue_321_model_integration.py

      - name: Validate focused contracts
        shell: bash
        run: |
          mkdir -p reports/issue-321
          set -o pipefail
          python -m unittest -v \
            tests.chess.test_solution_integrity \
            tests.chess.test_solution_integrity_model \
            test_chess_study_data_contracts \
            2>&1 | tee reports/issue-321/focused.log

      - name: Upload diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: issue-321-model-integration
          path: reports/issue-321/
          if-no-files-found: warn
          retention-days: 7

      - name: Remove one-time patch machinery
        run: |
          rm .github/scripts/apply_issue_321_model_integration.py
          rm .github/workflows/apply-issue-321-model-integration.yml

      - name: Commit integrated model
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Integrate solution integrity evidence (#321)"
          git push origin HEAD:${{ github.head_ref }}
