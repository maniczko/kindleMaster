name: Apply issue 322 test packaging

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write
  pull-requests: read

jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Verify packaged tests and remove duplicate root copies
        shell: bash
        run: |
          test -f tests/chess/test_exercise_reconciliation.py
          test -f tests/chess/test_exercise_model_reconciliation.py
          rm -f test_chess_exercise_reconciliation.py
          rm -f test_chess_exercise_model_reconciliation.py
          rm .github/workflows/apply-issue-322-test-packaging.yml

      - name: Commit cleanup
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Package canonical reconciliation tests (#322)"
          git pull --rebase origin "${{ github.head_ref }}"
          git push origin HEAD:"${{ github.head_ref }}"
