name: Temporary FEN Review Asset Export

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  export-assets:
    if: github.head_ref == 'tmp-fen-review-proxy-link'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Download FEN review assets
        env:
          ORIGIN: https://kindlemaster-production.up.railway.app
          ARTIFACT_ID: 758f23fa54e4484785d08d0a307d2675
        run: |
          python - <<'PY'
          from __future__ import annotations

          import json
          import os
          import re
          import time
          import urllib.error
          import urllib.request
          from concurrent.futures import ThreadPoolExecutor, as_completed
          from pathlib import Path

          origin = os.environ['ORIGIN'].rstrip('/')
          artifact_id = os.environ['ARTIFACT_ID']
          root = Path('_fen_review_assets')
          images = root / 'images'
          images.mkdir(parents=True, exist_ok=True)

          progress_url = f'{origin}/convert/artifact/{artifact_id}/chess_fen_review_progress'
          with urllib.request.urlopen(progress_url, timeout=90) as response:
              payload = json.load(response)
          rows = payload.get('rows') or []
          rows.sort(key=lambda row: int(row.get('review_index') or 0))
          (root / 'manifest.json').write_text(
              json.dumps(
                  {
                      'artifact_id': artifact_id,
                      'source_digest': payload.get('source_digest'),
                      'saved_at': payload.get('saved_at'),
                      'summary': payload.get('summary'),
                      'rows': rows,
                  },
                  ensure_ascii=False,
                  indent=2,
              ),
              encoding='utf-8',
          )

          def safe_name(value: object) -> str:
              return re.sub(r'[^A-Za-z0-9._-]+', '_', str(value or 'diagram'))

          jobs: list[tuple[str, Path]] = []
          for row in rows:
              index = int(row.get('review_index') or 0)
              diagram = safe_name(row.get('diagram_id'))
              marker_status = str(row.get('detected_marker_status') or '')
              keys = [
                  ('board', 'board_crop_rel_path'),
                  ('marker', 'marker_crop_rel_path'),
              ]
              if marker_status in {'ambiguous_marker', 'inferred_only'}:
                  keys.extend([
                      ('context', 'context_crop_rel_path'),
                      ('marker_search', 'marker_search_crop_rel_path'),
                  ])
              for kind, key in keys:
                  rel = str(row.get(key) or '').lstrip('/')
                  if not rel:
                      continue
                  url = f'{origin}/convert/artifact/{artifact_id}/{rel}'
                  destination = images / f'{index:03d}_{diagram}_{kind}.png'
                  jobs.append((url, destination))

          def download(item: tuple[str, Path]) -> tuple[str, int]:
              url, destination = item
              last_error: Exception | None = None
              for attempt in range(4):
                  try:
                      request = urllib.request.Request(url, headers={'User-Agent': 'KindleMaster-FEN-review-export/1.0'})
                      with urllib.request.urlopen(request, timeout=90) as response:
                          data = response.read()
                      if not data.startswith(b'\x89PNG'):
                          raise ValueError(f'not a PNG: {url}')
                      destination.write_bytes(data)
                      return destination.name, len(data)
                  except Exception as exc:
                      last_error = exc
                      time.sleep(1.5 * (attempt + 1))
              raise RuntimeError(f'failed {url}: {last_error}')

          total_bytes = 0
          failures: list[str] = []
          with ThreadPoolExecutor(max_workers=12) as executor:
              futures = [executor.submit(download, job) for job in jobs]
              for future in as_completed(futures):
                  try:
                      _, size = future.result()
                      total_bytes += size
                  except Exception as exc:
                      failures.append(str(exc))

          report = {
              'rows': len(rows),
              'files_expected': len(jobs),
              'files_downloaded': len(list(images.glob('*.png'))),
              'total_bytes': total_bytes,
              'failures': failures,
          }
          (root / 'download_report.json').write_text(json.dumps(report, indent=2), encoding='utf-8')
          print(json.dumps(report, indent=2))
          if failures:
              raise SystemExit(f'{len(failures)} asset downloads failed')
          PY

      - name: Upload FEN review assets
        uses: actions/upload-artifact@v4
        with:
          name: fen-review-assets
          path: _fen_review_assets
          compression-level: 0
          retention-days: 1
          if-no-files-found: error
