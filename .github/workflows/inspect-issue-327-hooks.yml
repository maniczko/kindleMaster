name: Inspect issue 327 release hook points

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/inspect-issue-327-hooks.yml"

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Locate hooks
        shell: bash
        run: |
          mkdir -p reports/issue-327-inspect
          {
            echo '== functions =='
            grep -R -n -E '^def (render_semantic_source_reader|run_chess_study_export|validate_study_export|build_chess_reader_semantic_book)' chess_study_export.py chess_auto_flow.py kindlemaster.py || true
            echo '== output writes around semantic reader =='
            grep -n -E 'semantic_source_reader|reader\.html|index\.html|write_text|write_bytes|epub' chess_study_export.py | tail -220 || true
            echo '== exact FEN gate modules =='
            grep -R -n -E 'fixed.edition|exact.FEN|fen.*release|release.*fen|gold.*corpus' --include='*.py' . | head -300 || true
            echo '== test parser and suites =='
            grep -n -E 'test_parser|QUALITY_CRITICAL_TESTS|RELEASE_TESTS|def _run_tests' kindlemaster.py || true
          } > reports/issue-327-inspect/hooks.txt
      - uses: actions/upload-artifact@v7
        with:
          name: issue-327-hook-inspection
          path: reports/issue-327-inspect/
          retention-days: 3
