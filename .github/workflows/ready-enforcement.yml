name: READY Enforcement

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ready-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GOVERNANCE_COVERAGE_FAIL_UNDER: "75"
  CORE_CONVERSION_COVERAGE_FAIL_UNDER: "70"
  CONVERTER_COVERAGE_FAIL_UNDER: "60"
  TEXT_NORMALIZATION_COVERAGE_FAIL_UNDER: "65"
  SEMANTIC_CLEANUP_COVERAGE_FAIL_UNDER: "70"

jobs:
  ready-governance:
    name: ready-governance (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.12"
            security_audit: false
            core_coverage: false
          - os: ubuntu-latest
            python-version: "3.13"
            security_audit: false
            core_coverage: false
          - os: ubuntu-latest
            python-version: "3.14"
            security_audit: true
            core_coverage: true
          - os: windows-latest
            python-version: "3.14"
            security_audit: false
            core_coverage: false
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up Node when workspace exists
        if: ${{ hashFiles('package.json') != '' }}
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Node workspace dependencies when workspace exists
        if: ${{ hashFiles('package.json') != '' }}
        run: npm ci

      - name: Bootstrap developer profile
        run: python kindlemaster.py bootstrap

      - name: Check installed dependency consistency
        run: python -m pip check

      - name: Run static-quality gate
        run: python -m ruff check --select E9,F63,F7,F82 --output-format=github kindlemaster.py github_issue_orchestration.py premium_tools.py scripts test_agent_config_contracts.py test_github_issue_orchestration.py test_github_ready_enforcement.py test_kindlemaster_entrypoint.py test_project_status.py test_skill_contracts.py test_skill_guardrails.py

      - name: Run dependency security audit
        if: ${{ matrix.security_audit }}
        run: python -m pip_audit -r requirements.txt -r requirements-dev.txt --progress-spinner off --timeout 60

      - name: Run governance coverage threshold
        run: |
          python -c "from pathlib import Path; Path('reports/coverage').mkdir(parents=True, exist_ok=True)"
          python -m coverage run -m unittest test_agent_config_contracts.py test_github_issue_orchestration.py test_github_ready_enforcement.py test_kindlemaster_entrypoint.py test_project_status.py test_skill_contracts.py test_skill_guardrails.py
          python -m coverage report --include="kindlemaster.py,github_issue_orchestration.py,scripts/generate_project_status.py" --fail-under=${{ env.GOVERNANCE_COVERAGE_FAIL_UNDER }}
          python -m coverage xml -o reports/coverage/coverage-${{ matrix.os }}-py${{ matrix.python-version }}.xml

      - name: Run core conversion coverage threshold
        if: ${{ matrix.core_coverage }}
        run: |
          python kindlemaster.py test --suite quality-critical
          python -m coverage xml -o reports/coverage/core-conversion-coverage-${{ matrix.os }}-py${{ matrix.python-version }}.xml

      - name: Upload governance artifacts
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: governance-${{ matrix.os }}-py${{ matrix.python-version }}
          path: |
            reports/coverage/
            .coverage
          if-no-files-found: warn
          retention-days: 14

  ready-quick:
    name: ready-quick
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Node when workspace exists
        if: ${{ hashFiles('package.json') != '' }}
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Node workspace dependencies when workspace exists
        if: ${{ hashFiles('package.json') != '' }}
        run: npm ci

      - name: Bootstrap runtime profile
        run: python kindlemaster.py bootstrap --runtime-only

      - name: Prepare reference inputs
        run: python kindlemaster.py prepare-reference-inputs

      - name: Run quick READY lane
        run: python kindlemaster.py test --suite quick

      - name: Run Sprint 1 QA regression gate
        run: python -m unittest test_sprint1_quality_gates.py

      - name: Run Vitest contract regressions when workspace exists
        shell: bash
        run: |
          if [[ ! -f package.json ]]; then
            echo "No package.json found; skipping Node contract regressions."
            echo "Future hook: pnpm run test:contracts:regression"
            exit 0
          fi

          corepack enable
          if [[ -f pnpm-lock.yaml ]]; then
            corepack prepare pnpm@9 --activate
            pnpm install --frozen-lockfile
            if node -e "const scripts=require('./package.json').scripts||{}; process.exit(scripts['typecheck'] ? 0 : 1)"; then
              pnpm run typecheck
            else
              echo "::notice::Node workspace found, but package.json has no typecheck script."
            fi
            if node -e "const scripts=require('./package.json').scripts||{}; process.exit(scripts['test:contracts:regression'] ? 0 : 1)"; then
              pnpm run test:contracts:regression
              pnpm run test:coverage
            else
              echo "::notice::Node workspace found, but package.json has no test:contracts:regression script."
              echo "Expected hook: pnpm run test:contracts:regression"
            fi
          else
            if [[ -f package-lock.json ]]; then
              npm ci
            else
              npm install
            fi
            if node -e "const scripts=require('./package.json').scripts||{}; process.exit(scripts['typecheck'] ? 0 : 1)"; then
              npm run typecheck
            else
              echo "::notice::Node workspace found, but package.json has no typecheck script."
            fi
            if node -e "const scripts=require('./package.json').scripts||{}; process.exit(scripts['test:contracts:regression'] ? 0 : 1)"; then
              npm run test:contracts:regression
              npm run test:coverage
            else
              echo "::notice::Node workspace found, but package.json has no test:contracts:regression script."
              echo "Expected hook: pnpm run test:contracts:regression"
            fi
          fi

      - name: Upload quick READY artifacts
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: ready-quick-evidence
          path: |
            reports/
            output/
          if-no-files-found: warn
          retention-days: 14

  ready-release:
    name: ready-release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Node when workspace exists
        if: ${{ hashFiles('package.json') != '' }}
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Node workspace dependencies when workspace exists
        if: ${{ hashFiles('package.json') != '' }}
        run: npm ci

      - name: Bootstrap developer profile
        run: python kindlemaster.py bootstrap

      - name: Install Playwright Chromium
        run: python -m playwright install chromium

      - name: Prepare reference inputs
        run: python kindlemaster.py prepare-reference-inputs

      - name: Run release READY lane
        env:
          KINDLEMASTER_RELEASE_PROOF_PROFILE: ci
        run: python kindlemaster.py test --suite release

      - name: Upload release READY artifacts
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: ready-release-evidence
          path: |
            reports/
            output/
          if-no-files-found: warn
          retention-days: 14

  ready-gate:
    name: ready-gate
    runs-on: ubuntu-latest
    needs:
      - ready-governance
      - ready-quick
      - ready-release
    if: ${{ always() }}
    steps:
      - name: Enforce READY aggregate gate
        shell: bash
        run: |
          if [[ "${{ needs.ready-governance.result }}" != "success" || "${{ needs.ready-quick.result }}" != "success" || "${{ needs.ready-release.result }}" != "success" ]]; then
            echo "READY enforcement failed: governance=${{ needs.ready-governance.result }}, quick=${{ needs.ready-quick.result }}, release=${{ needs.ready-release.result }}"
            exit 1
          fi
          echo "READY enforcement passed."
