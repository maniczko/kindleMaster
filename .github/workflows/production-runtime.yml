name: Production Runtime

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  durable-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Bootstrap runtime
        run: python kindlemaster.py bootstrap --runtime-only
      - name: Compile production runtime
        run: python -m py_compile durable_job_queue.py production_runtime.py production_worker.py production_server.py
      - name: Run durable queue tests
        run: python -m unittest -v production_tests.test_durable_job_queue production_tests.test_production_runtime
      - name: Verify production entrypoint imports
        env:
          KINDLEMASTER_DURABLE_DB_PATH: ${{ runner.temp }}/kindlemaster/runtime.sqlite3
        run: python -c "import production_server, production_worker; print('production runtime imports ok')"
      - name: Run repository quick compatibility
        shell: bash
        run: |
          set -o pipefail
          python kindlemaster.py test --suite quick 2>&1 | tee production-quick.log
      - name: Upload quick compatibility log
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: production-runtime-quick-log
          path: production-quick.log
          if-no-files-found: error
          retention-days: 7
