name: Apply issue 341 guest header

on:
  push:
    branches:
      - agent/issue-341-job-ownership

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: agent/issue-341-job-ownership
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Apply App patch
        run: python scripts/patch_issue_341_guest_header.py

      - name: Remove one-time patch machinery
        run: rm scripts/patch_issue_341_guest_header.py .github/workflows/apply-issue-341-guest-header.yml

      - name: Commit patched App
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Send guest identity in API headers (#341)"
          git push origin HEAD:agent/issue-341-job-ownership
