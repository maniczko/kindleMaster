<!doctype html>
<html lang="pl">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>KindleMaster Sprint 4 UI</title>
    <style>
      :root {
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: #172033;
        background: #f6f7f9;
      }
      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
      }
      main {
        width: min(680px, calc(100vw - 32px));
        padding: 24px;
        border: 1px solid #dfe4ec;
        border-radius: 8px;
        background: #fff;
        box-shadow: 0 14px 34px rgba(15, 23, 42, 0.08);
      }
      h1 {
        margin: 0 0 8px;
        font-size: 1.4rem;
        letter-spacing: 0;
      }
      p {
        margin: 0 0 16px;
        color: #647084;
      }
      code {
        padding: 2px 6px;
        border-radius: 6px;
        background: #f1f5f9;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>KindleMaster Sprint 4 UI</h1>
      <p>React/Vite shell is configured. Build it with <code>npm run build:ui</code>, then open <code>{{ local_app_url }}app</code>.</p>
      <p>During development run <code>npm run dev:ui</code> and use Vite on <code>http://127.0.0.1:5173/</code>.</p>
    </main>
  </body>
</html>
