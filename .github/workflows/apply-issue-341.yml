name: Apply issue 341 patch

on:
  push:
    branches:
      - agent/issue-341-job-ownership

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: agent/issue-341-job-ownership
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Apply ownership patch
        run: python scripts/apply_issue_341_patch.py

      - name: Validate generated Python
        run: python -m py_compile app.py conversion_job_access.py scripts/apply_issue_341_patch.py test_conversion_job_access.py test_job_ownership_security.py

      - name: Run ownership policy tests
        run: python -m unittest test_conversion_job_access.py

      - name: Remove patch machinery
        run: rm scripts/apply_issue_341_patch.py .github/workflows/apply-issue-341.yml

      - name: Commit generated changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --stat
          git commit -m "Enforce conversion job ownership (#341)"
          git push origin HEAD:agent/issue-341-job-ownership
