name: Chess Solution Reconciliation

on:
  pull_request:
    paths:
      - "chess_exercise_reconciliation.py"
      - "chess_exercise_model.py"
      - "tests/chess/test_exercise_reconciliation.py"
      - "tests/chess/test_exercise_model_reconciliation.py"
      - "test_chess_study_data_contracts.py"
      - "test_chess_study_pipeline.py"
      - ".github/workflows/chess-solution-reconciliation.yml"
  push:
    branches:
      - main
    paths:
      - "chess_exercise_reconciliation.py"
      - "chess_exercise_model.py"
      - "tests/chess/test_exercise_reconciliation.py"
      - "tests/chess/test_exercise_model_reconciliation.py"
      - "test_chess_study_data_contracts.py"
      - "test_chess_study_pipeline.py"

permissions:
  contents: read

jobs:
  reconciliation:
    name: reconciliation (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.14"]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Bootstrap runtime dependencies
        run: python kindlemaster.py bootstrap --runtime-only

      - name: Run reconciliation and compatibility tests
        shell: bash
        run: |
          mkdir -p reports/reconciliation
          set -o pipefail
          python -m unittest -v \
            tests.chess.test_exercise_reconciliation \
            tests.chess.test_exercise_model_reconciliation \
            test_chess_study_data_contracts \
            test_chess_study_pipeline \
            2>&1 | tee reports/reconciliation/python-${{ matrix.python-version }}.log

      - name: Upload reconciliation evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: chess-solution-reconciliation-python-${{ matrix.python-version }}
          path: reports/reconciliation/
          if-no-files-found: warn
          retention-days: 14
