name: Issue 341 Diagnostics

on:
  pull_request:
    paths:
      - "conversion_job_access.py"
      - "conversion_job_store_security.py"
      - "conversion_jobs.py"
      - "frontend/src/lib/api-base.ts"
      - "frontend/src/lib/api-base.test.ts"
      - "test_conversion_job_access.py"
      - "test_job_ownership_security.py"
      - ".github/workflows/issue-341-diagnostics.yml"
      - ".github/workflows/ready-enforcement.yml"

permissions:
  contents: read

jobs:
  quick-diagnostic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - run: npm ci
      - run: npm run build:ui
      - run: python kindlemaster.py bootstrap --runtime-only
      - run: python kindlemaster.py prepare-reference-inputs
      - name: Capture quick suite output
        shell: bash
        run: |
          mkdir -p reports/issue-341
          set -o pipefail
          python kindlemaster.py test --suite quick 2>&1 | tee reports/issue-341/quick.log
      - name: Upload quick diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: issue-341-quick-diagnostics
          path: reports/issue-341/
          if-no-files-found: warn
          retention-days: 7

  browser-diagnostic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - run: npm ci
      - run: npm run build:ui
      - run: python kindlemaster.py bootstrap
      - run: python -m playwright install chromium
      - name: Capture browser follow-up output
        shell: bash
        run: |
          mkdir -p reports/issue-341
          set -o pipefail
          python -m unittest -v test_browser_polling_runtime_harness.py test_react_shell_browser_smoke.py 2>&1 | tee reports/issue-341/browser.log
      - name: Upload browser diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: issue-341-browser-diagnostics
          path: reports/issue-341/
          if-no-files-found: warn
          retention-days: 7

  governance-diagnostic:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - run: npm ci
      - run: python kindlemaster.py bootstrap
      - name: Capture governance coverage output
        shell: bash
        run: |
          mkdir -p reports/issue-341
          set -o pipefail
          python -m coverage run -m unittest -v \
            test_agent_config_contracts.py \
            test_github_issue_orchestration.py \
            test_github_ready_enforcement.py \
            test_kindlemaster_entrypoint.py \
            test_project_status.py \
            test_skill_contracts.py \
            test_skill_guardrails.py \
            2>&1 | tee reports/issue-341/governance-tests-${{ matrix.python-version }}.log
          python -m coverage report \
            --include="kindlemaster.py,github_issue_orchestration.py,scripts/generate_project_status.py" \
            --fail-under=75 \
            2>&1 | tee reports/issue-341/governance-coverage-${{ matrix.python-version }}.log
      - name: Upload governance diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: issue-341-governance-${{ matrix.python-version }}
          path: reports/issue-341/
          if-no-files-found: warn
          retention-days: 7
